       "Keep up to three snapshots and return to any of them. The <b>autosave</b> updates itself every round.")}</p>
     <div class="slots">
       ${row(Bp("자동 저장","Autosave"),autoI,0)}
       ${SLOTS.map(n=>row(Bp("슬롯 "+n,"Slot "+n),slotInfo(readSlot(n)),n)).join("")}
     </div>
   </div>

   <div class="msec">
     <h3>${Bp("다른 기기로 옮기기","Move to another device")}</h3>
     <p style="margin-bottom:11px">${Bp(
       "브라우저 저장은 <b>그 기기에만</b> 남는다. 폰에서 하던 걸 노트북에서 이어가려면 아래 코드를 복사해서 옮기면 된다.",
       "Browser saves live <b>only on that device</b>. To continue a phone career on a laptop, copy the code below and paste it there.")}</p>
     <div class="sl-io">
       <label class="lbl">${Bp("내보내기 — 이 코드를 복사해 두자","Export - copy this code")}</label>
       <textarea id="expBox" class="codebox" readonly rows="3" ${inGame?"":"disabled"}>${inGame?exportCode():""}</textarea>
       <div class="sl-acts" style="margin-top:7px">
         <button class="b" id="btnCopy" ${inGame?"":"disabled"}>${Bp("코드 복사","Copy code")}</button>
         <button class="b" id="btnDl" ${inGame?"":"disabled"}>${Bp("파일로 저장","Save as file")}</button>
       </div>
     </div>
     <div class="sl-io" style="margin-top:13px">
       <label class="lbl">${Bp("가져오기 — 코드를 붙여넣거나 파일을 고르자","Import - paste a code or pick a file")}</label>
       <textarea id="impBox" class="codebox" rows="3" placeholder="${Bp("여기에 코드를 붙여넣기","Paste your code here")}"></textarea>
       <div class="sl-acts" style="margin-top:7px">
         <button class="b" id="btnImp">${Bp("코드로 불러오기","Load from code")}</button>
         <label class="b" style="cursor:pointer">${Bp("파일 선택","Choose file")}
           <input type="file" id="impFile" accept=".txt,text/plain" style="display:none"></label>
       </div>
     </div>
   </div>`;
}

<script>
/* ═════════ 학습 보조 ═════════ */

/* ── 결과 확률 추정 (몬테카를로) ──
   실제 주말 시뮬레이션과 같은 식으로 여러 번 돌려 확률을 낸다.
   퀄리파잉 그리드 효과는 작아서 생략한 근사치다. */
let _estCache=null;
function estimateOutcome(sims){
  sims=sims||300;
  const st=stratOf(), base=carPerf();
  const mine=S.seats.map(d=>base+0.20*d.s*(d.cond||1)+st.pace);
  const riv=[];
  S.rivals.forEach(r=>r.d.forEach(d=>riv.push({cp:r.cp,s:d.s})));
  const dnfP=(100-effRel())/100*0.30*st.risk;
  /* 피트 타이밍·세이프티카 등 레이스 중 사건을 반영한 추가 변동폭.
     실제 랩 시뮬 140회와 대조해 ±3.5로 보정했다. */
  const INC=3.5, nz=m=>(Math.random()*2-1)*m;
  let podium=0,win=0,inPts=0,sumPts=0;
  for(let n=0;n<sims;n++){
    const f=[];
    mine.forEach(p=>f.push({me:1,dnf:Math.random()<dnfP,
      v:p+nz(3)+nz(2)+nz(INC)}));
    riv.forEach(r=>f.push({me:0,dnf:Math.random()<0.036,
      v:r.cp+0.20*r.s*(0.92+Math.random()*0.16)+nz(3)+nz(2)+nz(INC)}));
    f.sort((a,b)=>(a.dnf-b.dnf)||(b.v-a.v));
    let best=99,got=0;
    f.forEach((c,i)=>{if(c.me&&!c.dnf){best=Math.min(best,i+1);got+=(PTS[i]||0);}});
    if(best===1)win++;
    if(best<=3)podium++;
    if(best<=10)inPts++;
    sumPts+=got;
  }
  return{podium:podium/sims,win:win/sims,points:inPts/sims,avgPts:sumPts/sims};
}
function estOutcome(){
  const key=[S.round,S.a,S.p,S.rel,S.strat,S.seats.map(d=>d.s+"_"+(d.cond||1).toFixed(2)).join(","),
             S.rivals.map(r=>r.cp.toFixed(1)).join(",")].join("|");
  if(!_estCache||_estCache.key!==key)_estCache={key,val:estimateOutcome()};
  return _estCache.val;
}
const pct=x=>(x*100).toFixed(0)+"%";

/* ── 미니 차트 ── */
function sparkMC(kind){          // 한계비용 곡선
  const cur=kind==="r"?S.rel:kind==="a"?S.a:S.p;
  const f=kind==="r"?mcR:kind==="a"?mcA:mcP;
  const from=Math.max(30,cur-8), to=Math.min(100,cur+22);
  const pts=[]; let max=0;
  for(let v=from;v<=to;v++){const c=f(v);max=Math.max(max,c);pts.push([v,c]);}
  const W=100,H=26;
  const x=v=>((v-from)/(to-from))*W;
  const y=c=>H-2-(c/max)*(H-5);
  const d=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path class="sp-line" d="${d}"/>
    <line class="sp-now" x1="${x(cur).toFixed(1)}" y1="2" x2="${x(cur).toFixed(1)}" y2="${H-2}"/>
    <circle class="sp-dot" cx="${x(cur).toFixed(1)}" cy="${y(f(cur)).toFixed(1)}" r="2.2"/></svg>`;
}

function seasonChart(){          // 라운드별 수익 vs 비용
  const rs=S.results.filter(r=>r.rev!==undefined);
  if(rs.length<2)return "";
  const W=520,H=132,PADL=34,PADB=18,PADT=8;
  const max=Math.max(...rs.map(r=>Math.max(r.rev,r.cost)))*1.12;
  const bw=(W-PADL-6)/rs.length;
  const y=v=>PADT+(H-PADT-PADB)*(1-v/max);
  const bars=rs.map((r,i)=>{
    const x0=PADL+i*bw;
    const w=bw*0.36;
    return `<rect class="ch-rev" x="${(x0+bw*0.10).toFixed(1)}" y="${y(r.rev).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-PADB-y(r.rev)).toFixed(1)}"/>
            <rect class="ch-cost" x="${(x0+bw*0.52).toFixed(1)}" y="${y(r.cost).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-PADB-y(r.cost)).toFixed(1)}"/>
            <text class="ch-x" x="${(x0+bw/2).toFixed(1)}" y="${H-5}">${r.r}</text>`;}).join("");
  const grid=[0,0.5,1].map(f=>{const v=max*f;
    return `<line class="ch-grid" x1="${PADL}" y1="${y(v).toFixed(1)}" x2="${W-4}" y2="${y(v).toFixed(1)}"/>
            <text class="ch-y" x="${PADL-5}" y="${(y(v)+3).toFixed(1)}">${v.toFixed(0)}</text>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg>
    <div class="ch-key">
      <span><i class="k-rev"></i>${Bp("라운드 수익","Revenue")}</span>
      <span><i class="k-cost"></i>${Bp("라운드 비용","Costs")}</span>
      <span class="ch-note">${Bp("막대가 뒤집히는 라운드가 돈이 새는 지점이다","Where the bars flip is where money leaks")}</span>
    </div>`;
}

function brandChart(){           // 브랜드 추이
  const rs=S.results.filter(r=>r.brand!==undefined);
  if(rs.length<2)return "";
  const W=520,H=92,PADL=34,PADB=16,PADT=8;
  const max=Math.max(60,...rs.map(r=>r.brand))*1.08;
  const x=i=>PADL+(W-PADL-8)*(i/(rs.length-1||1));
  const y=v=>PADT+(H-PADT-PADB)*(1-v/max);
  const d=rs.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(r.brand).toFixed(1)).join(" ");
  const area=d+` L${x(rs.length-1).toFixed(1)} ${H-PADB} L${x(0).toFixed(1)} ${H-PADB} Z`;
  const dots=rs.map((r,i)=>`<circle class="ch-dot" cx="${x(i).toFixed(1)}" cy="${y(r.brand).toFixed(1)}" r="2"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
      <line class="ch-grid" x1="${PADL}" y1="${y(max).toFixed(1)}" x2="${W-4}" y2="${y(max).toFixed(1)}"/>
      <text class="ch-y" x="${PADL-5}" y="${(y(max)+3).toFixed(1)}">${max.toFixed(0)}</text>
      <line class="ch-grid" x1="${PADL}" y1="${(H-PADB).toFixed(1)}" x2="${W-4}" y2="${(H-PADB).toFixed(1)}"/>
      <text class="ch-y" x="${PADL-5}" y="${(H-PADB+3).toFixed(1)}">0</text>
      <path class="ch-area" d="${area}"/><path class="ch-brand" d="${d}"/>${dots}</svg>
    <div class="ch-key"><span><i class="k-brand"></i>${Bp("브랜드 지수","Brand index")}</span>
      <span class="ch-note">${Bp("마케팅을 멈추면 곧바로 내려간다","Stop marketing and it falls straight away")}</span></div>`;
}

/* ── 실제 F1 대조 배지 ── */
function real(ko,en){
  return `<div class="realbox"><span class="rl">${Bp("실제 F1","REAL F1")}</span>
    <span>${LANG==="ko"?ko:LANG==="en"?en:ko+`<span class="en2">${en}</span>`}</span></div>`;
}
</script>
<script>
/* ═════════ 화면 라우터 ═════════ */
const PANES=["pPaddock","pPractice","pQuali","pRace","pResult","pFinish"];
function show(id){PANES.forEach(p=>$(p).classList.toggle("hide",p!==id));}

function renderGame(){
  paintTeam(T());
  renderHeader(); renderStats(); renderPhases(); renderSide();
  if(S.over&&S.phase==="finish"){renderFinish();show("pFinish");return;}
  switch(S.phase){
    case "paddock": renderPaddock(); show("pPaddock"); break;
    case "practice":renderPractice();show("pPractice");break;
    case "quali":   renderQuali();   show("pQuali");   break;
    case "race":    if(!RACE||RACE.done===undefined)initRace();
                    renderRaceShell(); show("pRace");  break;
    case "result":  renderResult();  show("pResult");  break;
  }
}
function rerender(){ if(S) renderGame(); else renderSelect(); }

/* ═════════ 이벤트 ═════════ */
document.addEventListener("click",e=>{
  const t=e.target;

  // 언어
  const lb=t.closest("[data-lang]");
  if(lb){LANG=lb.dataset.lang;
    document.querySelectorAll("#langseg button").forEach(b=>b.classList.toggle("on",b===lb));
    if(!$("manual").classList.contains("hide"))renderManual();
    if(!$("savebox").classList.contains("hide"))renderSave();
    rerender(); return;}

  // 설명서
  if(t.closest("#openSave")){openSave();return;}
  if(t.closest("#closeSave")){closeSave();return;}
  const sl=t.closest("[data-sl]");
  if(sl&&!sl.disabled){
    const act=sl.dataset.sl, n=+sl.dataset.n;
    const briefKo=x=>`${x.name} · 시즌 ${x.season} R${x.round} · P${x.pos} · ${x.pts}pts · ${M(x.cash)}`;
    const briefEn=x=>`${x.name} · Season ${x.season} R${x.round} · P${x.pos} · ${x.pts}pts · ${M(x.cash)}`;
    if(act==="save"){
      const ex=slotInfo(readSlot(n));
      if(ex&&!confirm(Bd(
        `슬롯 ${n}에 이미 저장본이 있다.\n\n${briefKo(ex)}\n\n덮어쓸까?`,
        `Slot ${n} already holds a save.\n\n${briefEn(ex)}\n\nOverwrite it?`)))return;
      saveToSlot(n)?toast(Bp("슬롯 "+n+"에 저장했다.","Saved to slot "+n+".")):toast(Bp("저장 공간이 부족하다.","Storage is full."),true);
      renderSave(); }
    else if(act==="load"){
      if(S&&!confirm(Bd(
        `지금 진행 중인 게임을 덮어쓴다.\n\n저장하지 않은 진행은 사라진다. 계속할까?`,
        `This replaces your current game.\n\nUnsaved progress will be lost. Continue?`)))return;
      if(n===0){ const r=(()=>{try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):null;}catch(e){return null;}})();
        if(r&&adoptState(r)){closeSave();toast(Bp("자동 저장을 불러왔다.","Autosave loaded."));}
        else toast(Bp("불러올 수 없다.","Could not load."),true); }
      else loadFromSlot(n);
    }
    else if(act==="del"){
      const ex=slotInfo(readSlot(n));
      if(ex&&!confirm(Bd(
        `슬롯 ${n}을 삭제할까?\n\n${briefKo(ex)}\n\n되돌릴 수 없다.`,
        `Delete slot ${n}?\n\n${briefEn(ex)}\n\nThis cannot be undone.`)))return;
      deleteSlot(n); renderSave(); toast(Bp("슬롯 "+n+" 삭제했다.","Slot "+n+" deleted.")); }
    return;}
  if(t.closest("#btnCopy")){
    const box=$("expBox"); box.select(); box.setSelectionRange(0,999999);
    const done=()=>toast(Bp("코드를 복사했다.","Code copied."));
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(box.value).then(done,()=>{try{document.execCommand("copy");done();}catch(e){toast(Bp("직접 선택해서 복사해야 한다.","Select the text and copy manually."),true);}});
    }else{try{document.execCommand("copy");done();}catch(e){toast(Bp("직접 선택해서 복사해야 한다.","Select the text and copy manually."),true);}}
    return;}
  if(t.closest("#btnDl")){downloadSave();toast(Bp("파일로 저장했다.","Save file downloaded."));return;}
  if(t.closest("#btnImp")){
    const v=$("impBox").value.trim();
    if(!v){toast(Bp("코드를 붙여넣어야 한다.","Paste a code first."),true);return;}
    if(importCode(v)){closeSave();toast(Bp("코드에서 불러왔다.","Loaded from code."));}
    else toast(Bp("코드를 읽을 수 없다. 전체를 정확히 붙여넣었는지 확인하자.","Could not read that code - make sure you pasted all of it."),true);
    return;}

  if(t.closest("#openManual")){renderManual();$("manual").classList.remove("hide");document.body.style.overflow="hidden";return;}
  if(t.closest("#closeManual")){$("manual").classList.add("hide");document.body.style.overflow="";return;}

  // 팀 선택
  const tb=t.closest("[data-team]");
  if(tb){picked=tb.dataset.team;paintTeam(TEAMS[picked]);
    $("tname").value=TEAMS[picked].n;$("start").disabled=false;renderSelect();return;}
  if(t.closest("#start")&&picked){
    S=newState(picked,($("tname").value.trim().toUpperCase()||TEAMS[picked].n));
    rollEvent();
    $("select").classList.add("hide");$("game").classList.remove("hide");
    renderGame();save();return;}

  if(!S)return;

  // 개발
  const bb=t.closest("[data-buy]");
  if(bb){const k=bb.dataset.buy,n=+bb.dataset.n;
    for(let i=0;i<n;i++){
      const cur=k==="a"?S.a:k==="p"?S.p:S.rel; if(cur>=100)break;
      const c=mcOf(k);
      const cc=c*S.mod.devMult;
      if(S.cash<cc||capAvail()<cc)break;
      S.cash-=cc;S.capUsed+=cc;S.devRound+=cc;S.ledger.dev+=cc;
      if(k==="a")S.a++;else if(k==="p")S.p++;else S.rel++;
      unlock("dim");unlock("opp");}
    save();renderGame();return;}

  // 마케팅 채널 토글
  const cb=t.closest("[data-chan]");
  if(cb&&!cb.disabled){const id=cb.dataset.chan;
    const i=S.mkList.indexOf(id);
    if(i>=0)S.mkList.splice(i,1);
    else{const C=CHANNELS.find(x=>x.id===id);
      if(mkPlanned()+C.cost<=S.cash){S.mkList.push(id);unlock("brand");}}
    save();renderGame();return;}

  // 스폰서 / 전략 / 자금
  const sb=t.closest("[data-sp]");
  if(sb&&!sb.disabled){S.sponsor=sb.dataset.sp;unlock("ev");save();renderGame();return;}
  const stb=t.closest("[data-st]");
  if(stb){S.strat=stb.dataset.st;unlock("risk");save();renderGame();return;}
  const fb=t.closest("[data-fin]");
  if(fb&&!fb.disabled){const a=fb.dataset.fin;
    if(a==="loan"&&S.debt+10<=LOAN_MAX){S.debt+=10;S.cash+=10;}
    else if(a==="repay"){const amt=Math.min(10,S.debt,S.cash);S.debt-=amt;S.cash-=amt;}
    else if(a==="equity"&&!S.equitySold){S.equitySold=true;S.cash+=EQ_CASH;}
    unlock("fund");save();renderGame();return;}

  // 드라이버
  const db=t.closest("[data-drv]");
  if(db&&!db.disabled){const act=db.dataset.drv,i=+db.dataset.i;
    const asAcad=d=>({n:d.n,s:d.s,c:d.c,sal:d.sal,age:d.age,pts:d.pts||0,paid:d.paid||0});
    if(act==="demote"){
      if(S.academy.length===0||S.academy.length>=3)return;
      const d=S.seats[i], up=S.academy.shift();
      S.academy.push(asAcad(d));
      S.seats[i]={...asAcad(up),no:i+1,pts:up.pts||0,cond:1};
      unlock("human");}
    else if(act==="promote"){
      const up=S.academy[i];
      const worst=S.seats[0].s<=S.seats[1].s?0:1;
      const d=S.seats[worst];
      S.academy[i]=asAcad(d);
      S.seats[worst]={...asAcad(up),no:worst+1,pts:up.pts||0,cond:1};
      unlock("human");}
    else if(act==="sign"){
      const nd=S.market[i], fee=driverValue(nd);
      if(S.cash<fee)return;
      S.cash-=fee; S.ledger.transferOut+=fee;
      const worst=S.seats[0].s<=S.seats[1].s?0:1;
      const d=S.seats[worst];
      S.market.splice(i,1);
      if(S.academy.length<3)S.academy.push(asAcad(d));
      S.seats[worst]={...asAcad(nd),no:worst+1,pts:0,cond:1,paid:fee};
      S.pendingTransfers.push({kind:"buy",n:nd.n,amt:fee,paid:0,gain:0});
      unlock("human");unlock("opp");unlock("sunk");}
    else if(act==="sellseat"){
      if(S.academy.length===0)return;                       // 대체 드라이버 필수
      const d=S.seats[i], price=sellPrice(d), paid=d.paid||0;
      const up=S.academy.shift();
      S.cash+=price; S.ledger.transferIn+=price; S.ledger.transferGain+=(price-paid);
      S.seats[i]={...asAcad(up),no:i+1,pts:up.pts||0,cond:1};
      S.pendingTransfers.push({kind:"sell",n:d.n,amt:price,paid,gain:price-paid});
      unlock("human");unlock("sunk");}
    else if(act==="sellacad"){
      const d=S.academy[i], price=sellPrice(d), paid=d.paid||0;
      S.cash+=price; S.ledger.transferIn+=price; S.ledger.transferGain+=(price-paid);
      S.academy.splice(i,1);
      S.pendingTransfers.push({kind:"sell",n:d.n,amt:price,paid,gain:price-paid});
      unlock("human");unlock("sunk");}
    save();renderGame();return;}

  // 연습 옵션
  const eo=t.closest("[data-evopt]");
  if(eo&&!eo.disabled&&S.ev&&!S.evDone){
    const e=evDef(), o=e.opts[+eo.dataset.evopt];
    if(!o.ok||o.ok(S)){ o.apply(S); S.evDone=true; save(); renderGame(); }
    return;}

  const pb=t.closest("[data-prac]");
  if(pb&&!pb.disabled){S.practiceSpend=pb.dataset.prac==="1"?1.2:0;save();renderGame();return;}
  // 퀄리 모드
  const qb=t.closest("[data-q]");
  if(qb&&!qb.disabled){S.qMode=qb.dataset.q;unlock("risk");save();renderGame();return;}

  // 단계 전환
  if(t.closest("#toPractice")){
    S.mkRound=mkPlanned();
    if(S.mkRound>S.cash){S.mkRound=0;S.mkList=[];}
    if(capAvail()<12)unlock("scarcity");
    unlock("fixvar");
    S.phase="practice";save();renderGame();return;}
  if(t.closest("#runPractice")){
    if(S.practiceSpend>0&&S.cash<S.practiceSpend){S.practiceSpend=0;}
    runPractice();renderGame();return;}
  if(t.closest("#toQuali")){S.phase="quali";save();renderGame();return;}
  if(t.closest("#runQuali")){runQuali();renderGame();return;}
  if(t.closest("#toRace")){S.phase="race";RACE=null;save();renderGame();startRace();return;}
  if(t.closest("#toResult")){
    if(raceTimer){clearTimeout(raceTimer);raceTimer=null;}
    settleRace();RACE=null;renderGame();window.scrollTo({top:0,behavior:"smooth"});return;}
  if(t.closest("#nextRound")){
    if(S.over){S.phase="finish";save();renderGame();window.scrollTo({top:0,behavior:"smooth"});return;}
    S.phase="paddock";rollEvent();save();renderGame();window.scrollTo({top:0,behavior:"smooth"});return;}

  // 속도
  const spb=t.closest("[data-spd]");
  if(spb){raceSpeed=+spb.dataset.spd;
    document.querySelectorAll("#spdSeg button").forEach(b=>b.classList.toggle("on",b===spb));
    if(RACE&&!RACE.done)tickRace(); return;}

  if(t.closest("#nextSeason")){
    nextSeason(); rollEvent(); renderGame(); window.scrollTo({top:0,behavior:"smooth"}); return;}
  if(t.closest("#again")||t.closest("#reset"))restart();
});

document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="impFile"){
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{ if(importCode(String(rd.result))){closeSave();toast(Bp("파일에서 불러왔다.","Loaded from file."));}
                    else toast(Bp("파일을 읽을 수 없다.","Could not read that file."),true); };
    rd.readAsText(f);
  }
});

function restart(){
  if(raceTimer){clearTimeout(raceTimer);raceTimer=null;}
  wipe();S=null;picked=null;RACE=null;
  document.documentElement.style.setProperty("--team","#E3002B");
  document.documentElement.style.setProperty("--team2","#FFC500");
  $("game").classList.add("hide");$("select").classList.remove("hide");
  $("start").disabled=true;$("tname").value="";
  renderSelect();window.scrollTo({top:0,behavior:"smooth"});
}

/* ═════════ 부팅 ═════════ */
renderSelect();
(function boot(){
  const s=loadS();
  if(s&&s.tk&&TEAMS[s.tk]&&s.round!==undefined){
    S=s;picked=s.tk;
    if(S.phase==="race"){S.phase="quali";S.grid=null;}   // 중계 도중 새로고침 → 퀄리로 복귀
    if(S.practiceDone===undefined)S.practiceDone=(S.phase!=="practice");
    if(S.season===undefined)S.season=1;
    if(!S.career)S.career={seasons:[],titles:0,targetsMet:0,netStart:S.cash};
    if(!S.pendingTransfers)S.pendingTransfers=[];
    if(!S.mod)S.mod=blankMod();
    if(S.prizeCut===undefined)S.prizeCut=0;
    if(S.ledger&&S.ledger.evCash===undefined){S.ledger.evCash=0;S.ledger.evCost=0;}
    if(S.ledger&&S.ledger.transferIn===undefined){S.ledger.transferIn=0;S.ledger.transferOut=0;S.ledger.transferGain=0;}
    S.rivals.forEach(r=>{if(r.baseCp===undefined)r.baseCp=r.cp;});
    if(S.over&&S.phase!=="result")S.phase="finish";
    $("select").classList.add("hide");$("game").classList.remove("hide");
    renderGame();
  }
})();
</script>
